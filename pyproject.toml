[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syncdap"
version = "2.0.0"
description = "Modular Rockbox and Digital Audio Player (DAP) music library synchronization coordinator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
authors = [
    { name = "bagi" }
]
dependencies = [
    "mutagen>=1.46.0",
    "eyed3>=0.9.7",
    "requests>=2.28.0",
    "pykakasi>=2.2.1",
    "syncedlyrics>=0.6.0",
]

[project.scripts]
syncdap = "src.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/syncdap",
    "/README.md",
    "/LICENSE",
]
